<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./bootstrap.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- form start -->
        <section class="h-100 bg-dark">
  <div class="container py-5 h-100">
   <form id="form-valid">
     <div class="row d-flex justify-content-center align-items-center h-100 ">
      <div class="col">
        <div class="card card-registration my-4">
          <div class="row g-0">
            <div class="col-xl-5 col-sm-6 ">
              <img src="./images/img.png"
                alt="Sample photo" class="img-fluid            style="border-top-left-radius: .25rem; border-bottom-left-radius: .25rem;" />
            </div>
            <div class="col-xl-7 col-sm-5 ">
              <div class="card-body p-md-5 text-black">
                <h3 class="mb-5 text-uppercase">Student registration form</h3>

                <div class="row">
                  <div class="col-md-12 mb-4">
                    <div data-mdb-input-init class="form-outline">
                      <input type="text" id="form3Example1m"  name="firstname" class="form-control form-control-lg" 
                    placeholder="first-name"/>

                      <!-- <label class="form-label" for="form3Example1m">First name</label> -->
                    </div>
                  </div>
                  <div class="col-md- mb-4">
                    <div data-mdb-input-init class="form-outline">
                      <input type="text" id="form3Example1n" name="lastname" class="form-control form-control-lg" 
                    placeholder="Last-name"/>

                      <!-- <label class="form-label" for="form3Example1n">Last name</label> -->
                    </div>
                  </div>
                </div>

                <!-- <div class="row">
                  <div class="col-md-12 mb-4">
                    <div data-mdb-input-init class="form-outline">
                      <input type="text" id="form3Example1n1"  name="fathername" class="form-control form-control-lg"
                    placeholder="father-name"/>

                    </div>
                  </div>
                </div> -->

                <div data-mdb-input-init class="form-outline mb-4">
                  <input type="text" id="form3Example8" name="address" class="form-control form-control-lg"
                    placeholder="address"/>
                  <!-- <label class="form-label" for="form3Example8">Address</label> -->
                </div>

                <div class="d-md-flex justify-content-start align-items-center mb-4 py-2">

                  <h6 class="mb-0 me-4">Gender: </h6>

                  <div class="form-check form-check-inline mb-0 me-4">
                    <input class="form-check-input" type="radio" name="gender" id="femaleGender"
                      value="Female" />
                    <label class="form-check-label" for="femaleGender">Female</label>
                  </div>

                  <div class="form-check form-check-inline mb-0 me-4">
                    <input class="form-check-input" type="radio" name="gender" id="maleGender"
                      value="Male" />
                    <label class="form-check-label" for="maleGender">Male</label>
                  </div>

                </div>

                <div class="row">
                    <h5>Enter your city</h5>
                  <div class="col-md-6 mb-4">

                    <select data-mdb-select-init>
                        <option value=""></option>
                      <option value="city">City</option>
                      <option value="karachi">karachi</option>
                      <option value="lahore">lahore</option>
                      <option value="islamabad">islamabad</option>
                    </select>

                  </div>
                </div>

                <div data-mdb-input-init class="form-outline mb-4">
                  <input type="date" id="form3Example9" name="dob" class="form-control form-control-lg" />
                  <!-- <label class="form-label" for="form3Example9">DOB</label> -->
                </div>


                <div data-mdb-input-init class="form-outline mb-4">
                  <input type="text" id="form3Example99" name="course" class="form-control form-control-lg" 
                    placeholder="course"/>
                  <!-- <label class="form-label" for="form3Example99">Course</label> -->
                </div>

                <div data-mdb-input-init class="form-outline mb-4">
                  <input type="text" id="form3Example97" name="emailid" class="form-control form-control-lg"   placeholder="email" />
                  <!-- <label class="form-label" for="form3Example97">Email ID</label> -->
                </div>

                <div data-mdb-input-init class="form-outline mb-4">
                  <input type="password" id="form3Example97" name="password" class="form-control form-control-lg" 
                  placeholder="password"/>
                  <!-- <label class="form-label" for="form3Example97">password</label> -->
                </div>

                <div class="d-flex justify-content-end pt-3">
                  <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn  btn-lg ms-2">Submit form</button>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
   </form>
  </div>
</section>

    <!-- form end -->


<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./bootstrap.js"></script>
    <script src="./app.js"></script>
</body>
</html>
